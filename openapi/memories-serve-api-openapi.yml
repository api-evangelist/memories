          type: string
          format: binary
          description: 'Video file to upload. Allowed extensions: .mp4, .avi, .mkv, .mov. Content-Type must start with video/. Max size 3 GB.'
        callback:
          type: string
          format: uri
          maxLength: 299
          example: https://your.app/callback
          description: Callback URL invoked when the video moves to the parsing stage. Max 299 characters.
        datetime_taken:
          type: string
          example: '2025-10-20 11:00:00'
          description: Capture time in format yyyy-MM-dd HH:mm:ss.
        camera_model:
          type: string
          maxLength: 200
          example: Canon EOS 5D
          description: Camera/device model. Max 200 characters.
        latitude:
          type: number
          format: double
          example: 66.66
        longitude:
          type: number
          format: double
          example: 66.66
        tags:
          type: array
          items:
            type: string
          maxItems: 20
          example:
          - test1
          - test2
          description: User-defined tags. Max 20. The server automatically appends an 'api' tag.
        retain_original_video:
          type: boolean
          default: true
        video_transcription_prompt:
          type: string
          example: Focus on the speaker and major scene changes.
        folder_id:
          type: integer
          description: Optional target folder for the upload. Omit or pass -1 for the account's Default folder (auto-created on first use). A positive id must belong to your account.
          example: 671631448308117500
      required:
      - file
    SearchPublicRequest:
      type: object
      properties:
        search_param:
          type: string
          example: Find sprint race with Usain Bolt
          description: Natural-language search query. Must be non-empty.
        search_type:
          type: string
          enum:
          - BY_VIDEO
          - BY_AUDIO
          default: BY_CLIP
          example: BY_VIDEO
          description: Search modality. Only BY_VIDEO and BY_AUDIO are accepted here; BY_CLIP and BY_IMAGE are explicitly rejected. BY_VIDEO is treated as BY_CLIP internally.
        type:
          type: string
          enum:
          - TIKTOK
          - YOUTUBE
          - INSTAGRAM
          default: TIKTOK
          description: Source platform to search within.
        top_k:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
          description: Maximum number of results to return. Range 1-1000.
        filtering_level:
          type: string
          enum:
          - low
          - medium
          - high
          example: medium
          description: Similarity-score filter. low=0.15, medium=0.225, high=0.4.
      required:
      - search_param
  responses:
    BinaryDownloadResponse:
      description: Binary video stream or JSON error response
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            $ref: '#/components/schemas/GenericJsonResponse'
    SseOrJsonResponse:
      description: Streaming SSE response or JSON response
      content:
        text/event-stream:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/GenericJsonResponse'
    SuccessJson:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericJsonResponse'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
