aid: memories
name: Memories
description: >-
  Memories.ai (MAVI) is a video-intelligence platform that turns raw video into
  searchable, agent-ready understanding. It ships three products on a shared
  video-understanding stack: Visual Intelligence (stateless REST APIs for
  transcription, captioning, frame description, embeddings, social-media
  scraping, and real-time audio/video stream moderation via VLMs such as Gemini,
  Nova, and Qwen), Visual Search (an auto-indexed private and public video/image
  library searchable by text, image, or transcript), and Visual Agents
  (pre-built workflows for video search, AI video editing, and screenplay
  extraction). The platform authenticates with sk-mavi- API keys, bills on a
  unified per-endpoint credit model, and is HIPAA, SOC 2 Type 2, and GDPR
  compliant. It is a Seedcamp portfolio company.
